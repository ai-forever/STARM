hydra:
  searchpath:
    - /config

defaults:
  - cfg_pretrain
  - override arch: hrm_v2DG
  - _self_

data_path: dataset/data/maze-30x30-hard-1k

global_batch_size: 1024

arch:
  L_layers: 4
  H_layers: 4

  L_cycles: 2
  H_cycles: 4

  grad_through_last_L: 2
  grad_through_last_H: 2

  L_gate: True
  L_trust_region: 0.7
  norm_after_L_step: True
  
  use_conv: False
  drop_H_transformer: True

  embed_dropout_p: 0.01
  qkv_dropout_p: 0.01
  residual_dropout_p: 0.01
  ffn_dropout_p: 0.01

  H_dropout_p: 0.0
  L_dropout_p: 0.0

  noise_intensity: 0.005

lr: 1e-04
lr_min_ratio: 0.01
puzzle_emb_lr: 1e-02

lr_scheduler: exponential
lr_warmup_ratio: 0.05

beta2: 0.995

epochs: 54000
eval_interval: 500

use_ema: True
